  <!--
    Episode scene 1: Grandpa explains the method on the board.
    In Remotion every stroke in #chalk-drawing is revealed with stroke-dashoffset, in document order.
    Pointer mode: if any child carries data-point="x y", the board is written from the first frame and
    grandpa taps each data-point with a pointer, in document order. He stands at the slot without a step,
    shoulder at (447 211), and the tip is comfortable 135-157 px from it: so each data-point sits just right
    of the end of its line, at x 290-310, and the stick runs off to the right over empty board.
    The coin sits by "vs", centred on the two rows of names, so its tip at x 292 is near the far end of that reach.
    Before and after, the arm hangs loose and the pointer slants down to the floor, tip near (354 341).
    The previous chalk content (GOLD and the method) is in archive/board-gold.svg, the Ink Free lettering
    in archive/board-inkfree.svg.

    Lettering: Caveat Brush, which build_episode.py loads as a web font (Ink Free is only the fallback).
    The chalk-rough filter wobbles the edges and bites dry grain out of #chalk-drawing, so it reads as chalk.
    The title's caps start at y ~146, clear of the frame's inner edge at y 140.

    Character slot: translate(388 111) scale(1), standing at the right edge of the board, chalk on the Grok arrow.
    At this scale the chalk reaches no higher than y ~152, so the board starts at y 136 and no stroke starts above y 156.
      head rotate(-6 80 80)          eyes translate(-3 0)
      arm-left rotate(30.4 59 100)    arm-left-forearm rotate(108 54 129)
      arm-right rotate(-11.1 101 100) arm-right-forearm rotate(62.9 106 129)
      leg-left rotate(1.5 72 152)    leg-left-foot rotate(-1.5 72 214)
      leg-right rotate(-1.5 88 152)  leg-right-foot rotate(1.5 88 214)
      front shoes shown, side shoes hidden; the soles land at y 332.5, just in front of the floor line.

    Wall decor keeps clear of the figure: a calendar and a clock above the board (the head never
    rises above y 141), and a tall bookcase on the right wall, past x 527, with a plant on top.
    It is static; only #chalk-drawing is animated.

    Palette: navy room, green board, orange wood. Classes carry a b- prefix, because the
    episode puts every scene in one document; "dash" stays bare, episode.js looks it up.
  -->

  <!--
    Episode scene 3: the camera flies in from desk.svg, whose monitor is this one at 196/580 scale.
    While grandpa sits at the desk, only #screen and what is on it show, over the desk's screen;
    #room is hidden, the desk draws its own.

    DRAFT: a real BTC chart with sample AI ideas drawn over it. episode.js fills the empty groups:
      #chart  real daily candles from assets/data/btc-daily.json (Coinbase), laid out like a trading
              screen: symbol row with the 1D timeframe, the last candle's OHLC, change and volume,
              price scale on the right with the last-price tag, Monday dates in UTC, volume bars
      #week   the next Mon-Fri, dashed: the window a weekly call covers
      #ideas  one dashed arrow per model from the last close, a robot head and the name at the tip

    archive/monitor-ledger.svg.

    Candles use the usual trading colours, green closed higher and red closed lower, so the chart
    reads as a real one at a glance. The model colours sit on the arrows, cards and names.

    Model colours, dark steps validated on the #0a1526 screen in this adjacent order:
      ChatGPT #199e70, Claude #d95926, Gemini #3987e5, Grok #c98500.
