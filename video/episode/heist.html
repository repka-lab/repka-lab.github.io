<svg id="s0-root" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <title>Scene 0: the Binance hack cold open</title>
  <!--
    Episode scene 0 for the Binance hack story (assets/data/heist.json): the date, BINANCE HACKED and
    the stolen sum, for a feed that plays muted. episode/heist-hook.js animates it:
      #big    the full sum from the first frame, under a short glitch burst; the resting frame stays calm
      #glitch hidden at rest; the burst shows it and moves the tears and the scan lines each frame
      #coins  steel coins streak right, out of frame: money leaving. Only the trails are red.
      #net    faint chains on the edges; the dashed red links are the drained ones and flow
    #who is centred by heist-hook.js once Bahnschrift is measured.

    Classes carry an hh- prefix, because the episode puts every scene in one document.
    The Binance mark is redrawn from its geometry and used only to name the subject of the story.
  -->
  <style>
    .hh-date { fill: #b9c6d8; font: 600 13px Bahnschrift, 'Segoe UI', sans-serif; letter-spacing: 6px; }
    .hh-who { fill: #f5f7fa; font: 700 32px Bahnschrift, 'Segoe UI', sans-serif; font-variation-settings: 'wdth' 90, 'wght' 700; letter-spacing: 5px; }
    .hh-pill { fill: #fff; font: 700 13px Bahnschrift, 'Segoe UI', sans-serif; letter-spacing: 3px; }
    .hh-big { font: 700 124px Bahnschrift, Impact, sans-serif; font-variation-settings: 'wdth' 78, 'wght' 700; letter-spacing: -2px; font-variant-numeric: tabular-nums; }
    .hh-sub { fill: #fff; font: 700 17px Bahnschrift, 'Segoe UI', sans-serif; letter-spacing: 5px; }
    .hh-brand { fill: #8193ad; font: 600 10px Bahnschrift, 'Segoe UI', sans-serif; letter-spacing: 2px; }
    .hh-glyph { fill: #b9c6d8; font: 700 11px 'Segoe UI', sans-serif; }
  </style>
  <defs>

      <stop offset="0" stop-color="#16284a"/><stop offset="0.45" stop-color="#0a1526"/><stop offset="1" stop-color="#03060c"/>
