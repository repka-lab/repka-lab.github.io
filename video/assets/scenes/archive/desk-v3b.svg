<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <title>Scene 2: at the computer</title>
  <!--
    Episode scene 2: Grandpa sits down at the computer.
    The camera then zooms into #screen, which becomes scene 3 (monitor.svg).

    Character slot: translate(168 104) scale(1), sitting, hands on the keyboard.
      head rotate(4 80 80)              eyes translate(3 -1)
      arm-left rotate(-57.6 64 100)     arm-left-forearm rotate(-44.7 58 135)
      arm-right rotate(-21.7 96 100)    arm-right-forearm rotate(-65.3 102 135)
      leg-left rotate(-90 72 166)       leg-left-shin rotate(90 72 208)
      leg-right rotate(-90 88 166)      leg-right-shin rotate(90 88 208)
      chalk display=none; side shoes shown pointing right, front shoes hidden
    Same scale as the board scene: the thighs rest on the seat at y 279.5, the soles land at y 314.5
    and the hands at y 228.5, just above the keyboard. The knees and toes stay left of the front desk leg at x 322.

    Palette: navy room, orange wood, green chair. Classes carry a d- prefix, because the
    episode puts every scene in one document; "steam" stays bare, episode.js looks it up.
  -->
  <style>
    .d-out { stroke: #0d1828; stroke-width: 2; stroke-linejoin: round; }
    .d-metal { fill: none; stroke: #8fa3bf; stroke-width: 4; stroke-linecap: round; }
    .d-seat { fill: #1f7a5c; }
    .d-wood { fill: #b8642a; }
    .d-wood-dark { fill: #8a4a1f; }
    .d-key { fill: #2b4365; stroke: #8fa3bf; stroke-width: 1.5; }
    .d-bezel { fill: #24395a; }
    .d-screen { fill: #0a1526; }
    .d-mug { fill: #f08a24; }
    .d-steam { fill: none; stroke: #cfe3ff; stroke-width: 2; stroke-linecap: round; opacity: 0.4; }
  </style>

  <rect width="640" height="360" fill="#13233a"/>
  <rect y="312" width="640" height="48" fill="#0d1828"/>
  <line x1="0" y1="312" x2="640" y2="312" stroke="#2b4365" stroke-width="3"/>

  <g id="chair">
    <line class="d-metal" x1="252" y1="288" x2="252" y2="301"/>
    <line class="d-metal" x1="234" y1="305" x2="270" y2="305"/>
    <circle cx="236" cy="310" r="4" fill="#8fa3bf"/>
    <circle cx="268" cy="310" r="4" fill="#8fa3bf"/>
    <path class="d-seat d-out" d="M220 284 L214 216 Q214 209 219.5 209 Q225 209 225 216 L229 282 Z"/>
    <rect class="d-seat d-out" x="218" y="279.5" width="68" height="8" rx="4"/>
  </g>

  <g id="desk">
    <rect class="d-wood-dark d-out" x="322" y="245" width="9" height="67"/>
    <rect class="d-wood-dark d-out" x="583" y="245" width="9" height="67"/>
    <rect class="d-wood d-out" x="274" y="237" width="334" height="8" rx="2"/>
  </g>
  <rect id="keyboard" class="d-key" x="280" y="230" width="46" height="6" rx="2"/>

  <g id="monitor">
    <line class="d-metal" x1="458" y1="224" x2="458" y2="234"/>
    <line class="d-metal" x1="436" y1="235.5" x2="480" y2="235.5"/>
    <rect class="d-bezel d-out" x="355" y="99" width="206" height="128" rx="9"/>
    <rect id="screen" class="d-screen" x="360" y="104" width="196" height="118" rx="6"/>
    <g id="screen-content">
      <line x1="372" y1="118" x2="440" y2="118" stroke="#f0efec" stroke-width="3" stroke-linecap="round"/>
      <line x1="372" y1="206" x2="470" y2="206" stroke="#2b4365" stroke-width="1"/>
      <line x1="442" y1="132" x2="442" y2="206" stroke="#6f86a6" stroke-width="1" stroke-dasharray="3 3"/>
      <polyline points="372,192 386,186 400,189 414,176 428,179 442,168 456,176 470,186" fill="none" stroke="#c9d3e0" stroke-width="2" stroke-linejoin="round"/>
      <rect x="486" y="138" width="40" height="7" rx="2" fill="#199e70"/>
      <rect x="486" y="150" width="52" height="7" rx="2" fill="#d95926"/>
      <rect x="486" y="162" width="48" height="7" rx="2" fill="#3987e5"/>
      <rect x="486" y="174" width="34" height="7" rx="2" fill="#c98500"/>
    </g>
  </g>

  <g id="mug">
    <path d="M580 222 Q591 228 580 234" fill="none" stroke="#0d1828" stroke-width="6" stroke-linecap="round"/>
    <path d="M580 222 Q591 228 580 234" fill="none" stroke="#f08a24" stroke-width="3" stroke-linecap="round"/>
    <rect class="d-mug d-out" x="560" y="216" width="20" height="21" rx="3"/>
    <path class="d-steam steam" d="M566 210 q-4 -6 0 -12 q4 -6 0 -12 M575 210 q-4 -6 0 -12 q4 -6 0 -12"/>
  </g>

  <!-- character -->
</svg>
