<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <title>Scene 3: the monitor</title>
  <!--
    Episode scene 3: the camera zooms into the screen from desk.svg.

    SAMPLE LAYOUT: every call and number here is a placeholder. In Remotion this screen
    is filled from data/ledger.json and data/results.json, never typed in by hand.

    Model colours, dark steps validated on the #0a1526 screen in this adjacent order:
      ChatGPT #199e70, Claude #d95926, Gemini #3987e5, Grok #c98500.
    Claude and Grok are too close to tell apart by colour alone,
    so every coloured mark has the model name next to it.
    The hit/miss reds and greens fail the deutan check, so ✓/✗ and the word always go with them.
  -->
  <style>
    .t-primary { fill: #eef2f6; font: 600 12px system-ui, 'Segoe UI', sans-serif; }
    .t-secondary { fill: #b9c6d8; font: 11px system-ui, 'Segoe UI', sans-serif; }
    .t-muted { fill: #8193ad; font: 10px system-ui, 'Segoe UI', sans-serif; }
    .num { font-variant-numeric: tabular-nums; }
    .grid { stroke: #1b2c45; stroke-width: 1; }
    .axis { stroke: #2b4365; stroke-width: 1; }
    .marker { stroke: #6f86a6; stroke-width: 1; stroke-dasharray: 3 4; }
  </style>

  <rect width="640" height="360" fill="#13233a"/>
  <rect x="296" y="330" width="48" height="30" fill="#24395a"/>
  <rect x="16" y="12" width="608" height="322" rx="14" fill="#24395a" stroke="#0d1828" stroke-width="4"/>
  <rect id="screen" x="30" y="26" width="580" height="294" rx="4" fill="#0a1526"/>

  <text class="t-primary" x="44" y="47">AI PREDICTION LAB · LEDGER</text>
  <text class="t-muted" x="596" y="47" text-anchor="end">SAMPLE LAYOUT · NOT REAL DATA</text>
  <line class="grid" x1="30" y1="58" x2="610" y2="58"/>

  <g id="panel-price">
    <text class="t-secondary" x="44" y="80">Gold · price around the forecast</text>
    <line class="grid" x1="52" y1="120" x2="336" y2="120"/>
    <line class="grid" x1="52" y1="170" x2="336" y2="170"/>
    <line class="grid" x1="52" y1="220" x2="336" y2="220"/>
    <line class="axis" x1="52" y1="270" x2="336" y2="270"/>
    <line class="marker" x1="220" y1="94" x2="220" y2="270"/>
    <line class="marker" x1="316" y1="94" x2="316" y2="270"/>
    <text class="t-muted" x="220" y="286" text-anchor="middle">recorded</text>
    <text class="t-muted" x="316" y="286" text-anchor="middle">verified</text>
    <polyline points="52,214 76,204 100,210 124,188 148,196 172,172 196,180 220,166 244,178 268,194 292,186 316,206 336,200" fill="none" stroke="#c9d3e0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="220" cy="166" r="4" fill="#eef2f6" stroke="#0a1526" stroke-width="2"/>
    <circle cx="316" cy="206" r="4" fill="#eef2f6" stroke="#0a1526" stroke-width="2"/>
  </g>

  <g id="panel-calls">
    <text class="t-secondary" x="364" y="80">Calls, recorded before the outcome</text>

    <rect x="364" y="94" width="10" height="10" rx="2" fill="#199e70"/>
    <text class="t-primary" x="382" y="103">ChatGPT</text>
    <text class="t-primary" x="462" y="103">↑ up</text>
    <text class="t-secondary num" x="508" y="103">conf 64</text>
    <text class="t-secondary" x="596" y="103" text-anchor="end"><tspan fill="#d03b3b">✗</tspan> miss</text>

    <rect x="364" y="116" width="10" height="10" rx="2" fill="#d95926"/>
    <text class="t-primary" x="382" y="125">Claude</text>
    <text class="t-primary" x="462" y="125">↓ down</text>
    <text class="t-secondary num" x="508" y="125">conf 58</text>
    <text class="t-secondary" x="596" y="125" text-anchor="end"><tspan fill="#0ca30c">✓</tspan> hit</text>

    <rect x="364" y="138" width="10" height="10" rx="2" fill="#3987e5"/>
    <text class="t-primary" x="382" y="147">Gemini</text>
    <text class="t-primary" x="462" y="147">↓ down</text>
    <text class="t-secondary num" x="508" y="147">conf 71</text>
    <text class="t-secondary" x="596" y="147" text-anchor="end"><tspan fill="#0ca30c">✓</tspan> hit</text>

    <rect x="364" y="160" width="10" height="10" rx="2" fill="#c98500"/>
    <text class="t-primary" x="382" y="169">Grok</text>
    <text class="t-primary" x="462" y="169">↑ up</text>
    <text class="t-secondary num" x="508" y="169">conf 80</text>
    <text class="t-secondary" x="596" y="169" text-anchor="end"><tspan fill="#d03b3b">✗</tspan> miss</text>
  </g>

  <g id="panel-hit-rate">
    <text class="t-secondary" x="364" y="200">Hit rate, all verified calls</text>
    <line class="axis" x1="430" y1="208" x2="430" y2="274"/>

    <text class="t-secondary" x="364" y="221">ChatGPT</text>
    <rect x="430" y="212" width="70" height="10" rx="2" fill="#199e70"/>
    <text class="t-secondary num" x="506" y="221">50%</text>

    <text class="t-secondary" x="364" y="237">Claude</text>
    <rect x="430" y="228" width="87" height="10" rx="2" fill="#d95926"/>
    <text class="t-secondary num" x="523" y="237">62%</text>

    <text class="t-secondary" x="364" y="253">Gemini</text>
    <rect x="430" y="244" width="81" height="10" rx="2" fill="#3987e5"/>
    <text class="t-secondary num" x="517" y="253">58%</text>

    <text class="t-secondary" x="364" y="269">Grok</text>
    <rect x="430" y="260" width="63" height="10" rx="2" fill="#c98500"/>
    <text class="t-secondary num" x="499" y="269">45%</text>
  </g>

  <line class="grid" x1="30" y1="296" x2="610" y2="296"/>
  <text class="t-muted" x="320" y="311" text-anchor="middle" style="font-size: 9.5px">This is an experiment and documentation, not financial advice. I do not recommend buying or selling anything.</text>
</svg>
