<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <title>Scene 3: the IPO monitor</title>
  <!--
    Episode scene 3 for the Anthropic IPO episode, full frame. The hook plays over it and the calls land on it.
    #screen fills the frame; #room is kept empty for the desk, which maps its own screen onto #screen.

    There is no chart: the stock has no price yet. Everything is 1.5 times the weekly screen's size, and
    the hook's tiles run nearly the frame's width, left of x 530 and below the hook's shade, so he stands
    at their right edge:
      #logos        the four models, filled by ipo-story.js; Claude's gets ringed
      #ipo-tile     the filing and the reported date; its lower half, #ipo-revenue, the one figure from the
                    filing, lands with its own caption; every figure is attributed
      #value-tile   the valuation Anthropic reportedly seeks, beside its last private one (both CNBC)
      #pop-tile    how US IPOs since 1980 closed day one (Ritter, Table 1a: 70.5% above the offer)
    Then the calls: #top states the pre-registered question, ipo-story.js fills #cards two by two from
    assets/data/ideas-anthropic-ipo.json, which holds the calls word for word from data/answers/anthropic-ipo,
    and rings Claude's card in Claude's colour so it ties to #disclosure, the climax.

    Model colours, dark steps validated on the #0a1526 screen in this adjacent order:
      ChatGPT #199e70, Claude #d95926, Gemini #3987e5, Grok #c98500.
    Claude and Grok are too close to tell apart by colour alone, so every card names its model,
    and the call is a word, never a colour.
  -->
  <style>
    .t-primary { fill: #eef2f6; font: 600 13px system-ui, 'Segoe UI', sans-serif; }
    .t-secondary { fill: #b9c6d8; font: 11px system-ui, 'Segoe UI', sans-serif; }
    .t-muted { fill: #8193ad; font: 11px system-ui, 'Segoe UI', sans-serif; }
    .num { font-variant-numeric: tabular-nums; }
    .grid { stroke: #1b2c45; stroke-width: 1; }
    .axis { stroke: #2b4365; stroke-width: 1; }
    .scale { fill: #8193ad; font: 11px system-ui, 'Segoe UI', sans-serif; }
    .week-dates { fill: #b9c6d8; }
    .pair { fill: #eef2f6; font: 700 15px system-ui, 'Segoe UI', sans-serif; }
    .coin { fill: #fff; font: 700 11px system-ui, 'Segoe UI', sans-serif; }
    .candle-up { --tone: #26a69a; }
    .candle-down { --tone: #ef5350; }
    .candle-body, .toned { fill: var(--tone); }
    .candle-wick { stroke: var(--tone); stroke-width: 1; }
    .candle-volume { fill: var(--tone); opacity: 0.3; }
    .price-line { stroke: var(--tone); stroke-width: 1; stroke-dasharray: 1 2; }
    .price-tag { fill: #fff; font: 700 11px system-ui, 'Segoe UI', sans-serif; }
    .week { fill: #0f1f37; stroke: #2b4365; stroke-width: 1; stroke-dasharray: 4 3; }
    .idea-name { fill: #b9c6d8; font: 700 11px system-ui, 'Segoe UI', sans-serif; }
    .card { fill: #0f1d33; stroke: #1b2c45; stroke-width: 1; }
    .card-name { fill: #eef2f6; font: 700 24px system-ui, 'Segoe UI', sans-serif; }
    .card-call { font: 700 24px system-ui, 'Segoe UI', sans-serif; }
    .card-up { fill: #2fc4b2; }
    .card-down { fill: #ff6b66; }
    .card-conf { fill: #8193ad; font: 600 22px system-ui, 'Segoe UI', sans-serif; }
    .card-reason { fill: #b9c6d8; font: 19px system-ui, 'Segoe UI', sans-serif; }
    .card-logo { fill: #0e0d0c; stroke: #2b4365; stroke-width: 1; }
    .kicker { fill: #8193ad; font: 600 15px system-ui, 'Segoe UI', sans-serif; letter-spacing: 1px; }
    .zone-text { fill: #b9c6d8; font: 19px system-ui, 'Segoe UI', sans-serif; }
    .tile-big { fill: #eef2f6; font: 700 39px system-ui, 'Segoe UI', sans-serif; }
    .tile-line { fill: #b9c6d8; font: 18px system-ui, 'Segoe UI', sans-serif; }
    .tile-source { fill: #8193ad; font: 16px system-ui, 'Segoe UI', sans-serif; }
    .top { fill: #eef2f6; font: 700 22px system-ui, 'Segoe UI', sans-serif; }
    .disclosure { fill: #d95926; fill-opacity: 0.12; stroke: #d95926; stroke-width: 1.5; }
    .disclosure-head { fill: #eef2f6; font: 700 24px system-ui, 'Segoe UI', sans-serif; }
  </style>

  <g id="room"></g>
  <rect id="screen" x="0" y="0" width="640" height="360" fill="#0a1526"/>

  <text id="title" class="t-primary" x="626" y="28" text-anchor="end" style="font-size: 18px">AI PREDICTION LAB · ANTHROPIC IPO</text>
  <line class="grid" x1="0" y1="40" x2="640" y2="40"/>

  <g id="chart"></g>
  <g id="week"></g>
  <g id="ideas"></g>

  <g id="logos"></g>

  <g id="ipo-tile">
    <rect class="card" x="16" y="110" width="510" height="212" rx="8"/>
    <text class="kicker" x="34" y="138">FILED · S-1 PUBLIC OCT 26, 2026</text>
    <text class="tile-big" x="34" y="184" style="font-size: 46px">ANT on Nasdaq</text>
    <text class="tile-source" x="34" y="209">Reported: as soon as Nov 19–20 · Fox Business</text>
    <g id="ipo-revenue">
      <line class="grid" x1="34" y1="224" x2="508" y2="224"/>
      <text class="kicker" x="34" y="250">FROM THE FILING · JUL–SEP 2026</text>
      <text class="tile-big num" x="34" y="294" style="font-size: 46px">≈$17B<tspan class="tile-line" dx="12" style="font-size: 26px">revenue</tspan></text>
      <text class="tile-source" x="34" y="314">up ~1,127% year on year · filing, via CNBC</text>
    </g>
  </g>

  <g id="value-tile">
    <rect class="card" x="16" y="114" width="510" height="196" rx="8"/>
    <text class="kicker" x="34" y="144">REPORTED · VALUATION SOUGHT IN THE IPO</text>
    <text class="tile-big num" x="34" y="216" style="font-size: 64px">$1.5–2T</text>
    <text class="zone-text num" x="34" y="258" style="font-size: 24px">Last private valuation: <tspan font-weight="700">$965B</tspan>, in May</text>
    <text class="tile-source" x="34" y="292" style="font-size: 18px">Source: CNBC, Oct 26 and 27</text>
  </g>

  <g id="pop-tile">
    <rect class="card" x="16" y="114" width="510" height="196" rx="8"/>
    <text class="kicker" x="34" y="144">US IPOS SINCE 1980 · DAY ONE</text>
    <text id="pop-big" class="tile-big num" x="34" y="216" style="font-size: 64px">≈7 in 10</text>
    <g id="pop-dots"></g>
    <text class="zone-text" x="34" y="258" style="font-size: 24px">closed <tspan fill="#2fc4b2" font-weight="700">above</tspan> the offer price</text>
    <text class="tile-source" x="34" y="292" style="font-size: 18px">Source: Jay Ritter, IPO Statistics (1980–2025)</text>
  </g>

  <text id="top" class="top" x="16" y="68">Day one: close <tspan fill="#2fc4b2">above</tspan> the offer price?</text>

  <g id="cards"></g>

  <g id="disclosure">
    <rect x="16" y="82" width="298" height="114" rx="8" fill="#0a1526"/>
    <rect class="disclosure" x="16" y="82" width="298" height="114" rx="8"/>
    <text class="kicker" x="32" y="114">DISCLOSURE</text>
    <text class="disclosure-head" x="32" y="150">Anthropic makes Claude.</text>
    <text class="tile-line" x="32" y="180">Claude said so in its own answer.</text>
  </g>

  <line class="grid" x1="0" y1="328" x2="640" y2="328"/>
  <text class="t-muted" x="320" y="347" text-anchor="middle" style="font-size: 10px">This is an experiment and documentation, not financial advice. I do not recommend buying or selling anything.</text>
</svg>
