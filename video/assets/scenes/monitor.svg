<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <title>Scene 3: the monitor</title>
  <!--
    Episode scene 3: the camera flies in from desk.svg, whose monitor is this one at 196/580 scale.
    While grandpa sits at the desk, only #screen and what is on it show, over the desk's screen;
    #room is hidden, the desk draws its own.

    DRAFT: a real BTC chart with sample AI ideas drawn over it. episode.js fills the empty groups:
      #chart  real daily candles from assets/data/btc-daily.json (Coinbase), laid out like a trading
              screen: symbol row with the 1D timeframe, the last candle's OHLC, change and volume,
              price scale on the right with the last-price tag, Monday dates in UTC, volume bars
      #week   the next Mon-Fri, dashed: the window a weekly call covers
      #ideas  one dashed arrow per model from the last close, a robot head and the name at the tip
      #cards  one card per model: call and a short reason, from assets/data/ideas-sample.json
    The ideas are hand-written samples, not real calls. The ledger version of this screen is in
    archive/monitor-ledger.svg.

    The arrow fan angles only separate the models; they don't encode any size of move.
    Candles use the usual trading colours, green closed higher and red closed lower, so the chart
    reads as a real one at a glance. The model colours sit on the arrows, cards and names.

    Model colours, dark steps validated on the #0a1526 screen in this adjacent order:
      ChatGPT #199e70, Claude #d95926, Gemini #3987e5, Grok #c98500.
    Claude and Grok are too close to tell apart by colour alone,
    so every coloured mark has the model name next to it, and the call is a word, never a colour.
  -->
  <style>
    .t-primary { fill: #eef2f6; font: 600 12px system-ui, 'Segoe UI', sans-serif; }
    .t-secondary { fill: #b9c6d8; font: 11px system-ui, 'Segoe UI', sans-serif; }
    .t-muted { fill: #8193ad; font: 10px system-ui, 'Segoe UI', sans-serif; }
    .num { font-variant-numeric: tabular-nums; }
    .grid { stroke: #1b2c45; stroke-width: 1; }
    .axis { stroke: #2b4365; stroke-width: 1; }
    .scale { fill: #8193ad; font: 9px system-ui, 'Segoe UI', sans-serif; }
    .week-dates { fill: #b9c6d8; }
    .legend { fill: #8193ad; font: 9.5px system-ui, 'Segoe UI', sans-serif; }
    .coin { fill: #fff; font: 700 9px system-ui, 'Segoe UI', sans-serif; }
    .pill-on { fill: #1e3352; }
    .pill-text { fill: #8193ad; font: 600 8.5px system-ui, 'Segoe UI', sans-serif; }
    .pill-text-on { fill: #eef2f6; font: 600 8.5px system-ui, 'Segoe UI', sans-serif; }
    .candle-up { --tone: #26a69a; }
    .candle-down { --tone: #ef5350; }
    .candle-body, .toned { fill: var(--tone); }
    .candle-wick { stroke: var(--tone); stroke-width: 1; }
    .candle-volume { fill: var(--tone); opacity: 0.3; }
    .price-line { stroke: var(--tone); stroke-width: 1; stroke-dasharray: 1 2; }
    .price-tag { fill: #fff; font: 700 8.5px system-ui, 'Segoe UI', sans-serif; }
    .week { fill: #0f1f37; stroke: #2b4365; stroke-width: 1; stroke-dasharray: 4 3; }
    .card { fill: #0f1d33; stroke: #1b2c45; stroke-width: 1; }
  </style>

  <g id="room">
    <rect width="640" height="360" fill="#13233a"/>
    <rect x="296" y="330" width="48" height="30" fill="#24395a"/>
    <rect x="16" y="12" width="608" height="322" rx="14" fill="#24395a" stroke="#0d1828" stroke-width="4"/>
  </g>
  <rect id="screen" x="30" y="26" width="580" height="294" rx="4" fill="#0a1526"/>

  <text class="t-primary" x="44" y="47">AI PREDICTION LAB · NEXT WEEK'S BTC CALLS</text>
  <rect x="408" y="35" width="40" height="16" rx="3" fill="none" stroke="#6f86a6" stroke-width="1"/>
  <text class="t-primary" x="428" y="47" text-anchor="middle" style="font-size: 10px">DRAFT</text>
  <text class="t-muted" x="596" y="47" text-anchor="end">sample ideas, not real calls</text>
  <line class="grid" x1="30" y1="58" x2="610" y2="58"/>

  <g id="chart"></g>
  <g id="week"></g>
  <g id="ideas"></g>
  <g id="cards"></g>

  <line class="grid" x1="30" y1="296" x2="610" y2="296"/>
  <text class="t-muted" x="320" y="311" text-anchor="middle" style="font-size: 9.5px">This is an experiment and documentation, not financial advice. I do not recommend buying or selling anything.</text>
</svg>
