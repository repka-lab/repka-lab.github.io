<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <title>Scene 3: the monitor</title>
  <!--
    Episode scene 3: the trading screen, full frame. The hook plays over it and the calls land on it.
    #screen fills the frame; #room is kept empty for the desk, which maps its own screen onto #screen.

    A real BTC chart with each AI's call for the week drawn over it. episode.js fills the empty groups:
      #title  gets the call week appended, the same Mon-Fri as #week
      #chart  real daily candles from assets/data/btc-daily.json (Coinbase): the symbol and 1D timeframe
              in the header, price scale on the right with the last-price tag, Monday dates in UTC,
              volume bars
      #week   the next Mon-Fri, dashed: the window a weekly call covers
      #ideas  one dashed arrow per model from the last close, its name in the lane at the tip
              (call-story.js leaves the names out: each call's card lands with its arrow)
      #cards  one card per model in the right column: the site's logo on a dark tile, name, call,
              confidence and a reason of at most ten words, from the ideas file
    The ideas file must hold the calls as logged in data/ledger.json; assets/data/ideas-sample.json
    is a placeholder for laying out the template. The ledger version of this screen is in
    archive/monitor-ledger.svg.

    The arrow fan angles only separate the models; they don't encode any size of move.
    Candles use the usual trading colours, green closed higher and red closed lower, so the chart
    reads as a real one at a glance. The model colours sit on the arrows and the card bars.

    Model colours, dark steps validated on the #0a1526 screen in this adjacent order:
      ChatGPT #199e70, Claude #d95926, Gemini #3987e5, Grok #c98500.
    Claude and Grok are too close to tell apart by colour alone,
    so every coloured mark has the model name next to it (in the call story, the card that lands with
    each arrow names its colour), and the call is a word, never a colour.
  -->
  <style>
    .t-primary { fill: #eef2f6; font: 600 13px system-ui, 'Segoe UI', sans-serif; }
    .t-secondary { fill: #b9c6d8; font: 11px system-ui, 'Segoe UI', sans-serif; }
    .t-muted { fill: #8193ad; font: 11px system-ui, 'Segoe UI', sans-serif; }
    .num { font-variant-numeric: tabular-nums; }
    .grid { stroke: #1b2c45; stroke-width: 1; }
    .axis { stroke: #2b4365; stroke-width: 1; }
    .scale { fill: #8193ad; font: 11px system-ui, 'Segoe UI', sans-serif; }
    .week-dates { fill: #b9c6d8; }
    .pair { fill: #eef2f6; font: 700 15px system-ui, 'Segoe UI', sans-serif; }
    .coin { fill: #fff; font: 700 11px system-ui, 'Segoe UI', sans-serif; }
    .candle-up { --tone: #26a69a; }
    .candle-down { --tone: #ef5350; }
    .candle-body, .toned { fill: var(--tone); }
    .candle-wick { stroke: var(--tone); stroke-width: 1; }
    .candle-volume { fill: var(--tone); opacity: 0.3; }
    .price-line { stroke: var(--tone); stroke-width: 1; stroke-dasharray: 1 2; }
    .price-tag { fill: #fff; font: 700 11px system-ui, 'Segoe UI', sans-serif; }
    .week { fill: #0f1f37; stroke: #2b4365; stroke-width: 1; stroke-dasharray: 4 3; }
    .idea-name { fill: #b9c6d8; font: 700 11px system-ui, 'Segoe UI', sans-serif; }
    .card { fill: #0f1d33; stroke: #1b2c45; stroke-width: 1; }
    .card-name { fill: #eef2f6; font: 700 17px system-ui, 'Segoe UI', sans-serif; }
    .card-call { font: 700 17px system-ui, 'Segoe UI', sans-serif; }
    .card-up { fill: #2fc4b2; }
    .card-down { fill: #ff6b66; }
    .card-conf { fill: #8193ad; font: 600 15px system-ui, 'Segoe UI', sans-serif; }
    .card-reason { fill: #b9c6d8; font: 14px system-ui, 'Segoe UI', sans-serif; }
    .card-logo { fill: #0e0d0c; stroke: #2b4365; stroke-width: 1; }
  </style>

  <g id="room"></g>
  <rect id="screen" x="0" y="0" width="640" height="360" fill="#0a1526"/>

  <text id="title" class="t-primary" x="626" y="25" text-anchor="end">AI PREDICTION LAB</text>
  <line class="grid" x1="0" y1="38" x2="640" y2="38"/>

  <g id="chart"></g>
  <g id="week"></g>
  <g id="ideas"></g>
  <g id="cards"></g>

  <line class="grid" x1="0" y1="328" x2="640" y2="328"/>
  <text class="t-muted" x="320" y="347" text-anchor="middle" style="font-size: 10px">This is an experiment and documentation, not financial advice. I do not recommend buying or selling anything.</text>
</svg>
