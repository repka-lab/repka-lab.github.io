<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 260" width="320" height="520">
  <title>Grandpa, AI researcher character</title>
  <!--
    Character rig for Remotion: a flat-vector grandpa in a suit, with beard, glasses and an "AI" badge.
    Every movable part is its own group; nesting keeps the forearm on the elbow and the shin on the knee.
    Rotate a part with rotate(angle pivotX pivotY) around its pivot:

      head                   80,80   neck
      arm-left               64,100  shoulder
        arm-left-forearm     58,135  elbow (holds the chalk)
      arm-right              96,100  shoulder
        arm-right-forearm    102,135 elbow
      leg-left, leg-right    80,170  hip
        leg-left-shin        68,210  knee
        leg-right-shin       92,210  knee
      eyes                   translate by 2-3 to look left/right
      eye-left, eye-right    blink = scaleY around cy 51
      chalk                  display="none" when not at the board

    Hands sit at 50.6,165.6 and 109.4,165.6, the chalk tip at 47.6,177.7, the soles at y 252.5.
    Each limb draws its outline first and its colour last, after the nested part,
    so elbows and knees bend without a seam.
    The badge is drawn above the arms on purpose: "AI" must stay readable in every pose.
    Ready poses (standing at the board, sitting at the desk) are listed
    in the comments of video/assets/scenes/board.svg and desk.svg.
    Classes carry a gp- prefix: the episode puts every scene in one document, so styles are global.
  -->
  <style>
    .gp-line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .gp-out { stroke: #0d1828; stroke-width: 2; stroke-linejoin: round; }
    .gp-sleeve-edge { stroke: #0d1828; stroke-width: 14; }
    .gp-sleeve { stroke: #4a6c9e; stroke-width: 10.5; }
    .gp-cuff { fill: none; stroke: #eef2f6; stroke-width: 10; }
    .gp-leg-edge { stroke: #0d1828; stroke-width: 16; }
    .gp-leg { stroke: #34507c; stroke-width: 12.5; }
    .gp-suit { fill: #4a6c9e; }
    .gp-suit-dark { fill: #3a5784; }
    .gp-shirt { fill: #eef2f6; }
    .gp-tie { fill: #f08a24; }
    .gp-skin { fill: #f1c7a5; }
    .gp-nose { fill: #eba889; }
    .gp-hair { fill: #dfe4ea; }
    .gp-hair-light { fill: #f4f6f9; }
    .gp-strand { stroke: #b5bfcb; stroke-width: 1.4; }
    .gp-shoe { fill: #6b3a1c; }
    .gp-badge { fill: #2fb586; }
    .gp-badge-text { fill: #0d1828; font: 800 9.5px 'Segoe UI', system-ui, sans-serif; }
  </style>

  <g id="grandpa">
    <g id="leg-left">
      <line class="gp-line gp-leg-edge" x1="80" y1="170" x2="68" y2="210"/>
      <g id="leg-left-shin">
        <line class="gp-line gp-leg-edge" x1="68" y1="210" x2="64.6" y2="244"/>
        <line class="gp-line gp-leg" x1="68" y1="210" x2="64.6" y2="244"/>
        <path class="gp-shoe gp-out" d="M73 242.5 L73 252.5 L52 252.5 Q48.5 252.5 49.5 248.5 Q51.5 243 60 242.5 Z"/>
      </g>
      <line class="gp-line gp-leg" x1="80" y1="170" x2="68" y2="210"/>
    </g>
    <g id="leg-right">
      <line class="gp-line gp-leg-edge" x1="80" y1="170" x2="92" y2="210"/>
      <g id="leg-right-shin">
        <line class="gp-line gp-leg-edge" x1="92" y1="210" x2="95.4" y2="244"/>
        <line class="gp-line gp-leg" x1="92" y1="210" x2="95.4" y2="244"/>
        <path class="gp-shoe gp-out" d="M87 242.5 L87 252.5 L108 252.5 Q111.5 252.5 110.5 248.5 Q108.5 243 100 242.5 Z"/>
      </g>
      <line class="gp-line gp-leg" x1="80" y1="170" x2="92" y2="210"/>
    </g>

    <g id="torso">
      <path class="gp-suit gp-out" d="M58 97 C66 93 94 93 102 97 C106 99 107 103 107 108 L105 178 C97 183 63 183 55 178 L53 108 C53 103 54 99 58 97 Z"/>
      <path class="gp-shirt" d="M69 95 L91 95 L80 131 Z"/>
      <path class="gp-tie gp-out" d="M76.5 97 L83.5 97 L82 104 L78 104 Z M78 104 L82 104 L85 125 L80 131 L75 125 Z"/>
      <path class="gp-suit-dark gp-out" d="M69 95 L61 105 L66.5 108.5 L63 112 L80 131 Z M91 95 L99 105 L93.5 108.5 L97 112 L80 131 Z"/>
      <line class="gp-line" x1="80" y1="131" x2="80" y2="180" stroke="#0d1828" stroke-width="1.5"/>
      <circle cx="80" cy="158" r="2.2" fill="#0d1828"/>
      <circle cx="80" cy="169" r="2.2" fill="#0d1828"/>
    </g>

    <g id="arm-right">
      <line class="gp-line gp-sleeve-edge" x1="96" y1="100" x2="102" y2="135"/>
      <g id="arm-right-forearm">
        <line class="gp-line gp-sleeve-edge" x1="102" y1="135" x2="107.66" y2="158.33"/>
        <line class="gp-line gp-sleeve" x1="102" y1="135" x2="107.66" y2="158.33"/>
        <line class="gp-cuff" x1="107.19" y1="156.38" x2="108.14" y2="160.27"/>
        <circle class="gp-skin gp-out" cx="109.42" cy="165.61" r="6"/>
      </g>
      <line class="gp-line gp-sleeve" x1="96" y1="100" x2="102" y2="135"/>
    </g>
    <g id="arm-left">
      <line class="gp-line gp-sleeve-edge" x1="64" y1="100" x2="58" y2="135"/>
      <g id="arm-left-forearm">
        <line class="gp-line gp-sleeve-edge" x1="58" y1="135" x2="52.34" y2="158.33"/>
        <line class="gp-line gp-sleeve" x1="58" y1="135" x2="52.34" y2="158.33"/>
        <line class="gp-cuff" x1="52.81" y1="156.38" x2="51.86" y2="160.27"/>
        <g id="chalk">
          <line x1="50" y1="168" x2="47.6" y2="177.7" stroke="#0d1828" stroke-width="6.5" stroke-linecap="round"/>
          <line x1="50" y1="168" x2="47.6" y2="177.7" stroke="#f4f1e8" stroke-width="3.5" stroke-linecap="round"/>
        </g>
        <circle class="gp-skin gp-out" cx="50.58" cy="165.61" r="6"/>
      </g>
      <line class="gp-line gp-sleeve" x1="64" y1="100" x2="58" y2="135"/>
    </g>

    <g id="badge">
      <rect class="gp-badge gp-out" x="69" y="135.5" width="22" height="14" rx="3"/>
      <text class="gp-badge-text" x="80" y="146.2" text-anchor="middle">AI</text>
    </g>

    <g id="head">
      <path id="hair" class="gp-hair gp-out" d="M68 27 Q52 25 49 36 Q43 42 47 49 Q44 56 51 60 L62 60 Z M92 27 Q108 25 111 36 Q117 42 113 49 Q116 56 109 60 L98 60 Z"/>
      <circle class="gp-skin gp-out" cx="56" cy="55" r="5.5"/>
      <circle class="gp-skin gp-out" cx="104" cy="55" r="5.5"/>
      <ellipse class="gp-skin gp-out" cx="80" cy="50" rx="24" ry="28"/>
      <ellipse cx="90" cy="30" rx="5" ry="2.5" fill="#ffffff" opacity="0.35" transform="rotate(-20 90 30)"/>
      <path class="gp-line" d="M69 26 Q80 20 92 26" stroke="#dfe4ea" stroke-width="2"/>
      <path id="beard" class="gp-hair gp-out" d="M56 50 C56 62 57 73 63 81 C68 90 74 96 80 96 C86 96 92 90 97 81 C103 73 104 62 104 50 C101 58 96 62 90 63 C86 64 83 62 80 62 C77 62 74 64 70 63 C64 62 59 58 56 50 Z"/>
      <path class="gp-line gp-strand" d="M68 76 Q70 82 74 86 M92 76 Q90 82 86 86 M80 84 L80 90"/>
      <ellipse class="gp-nose gp-out" cx="80" cy="59" rx="5" ry="4.2"/>
      <path id="mustache" class="gp-hair-light gp-out" d="M63 69 C66 62 74 61 80 65 C86 61 94 62 97 69 C92 70.5 86 69.5 80 68 C74 69.5 68 70.5 63 69 Z"/>
      <path id="mouth" class="gp-line" d="M75 72.5 Q80 76.5 85 72.5" stroke="#0d1828" stroke-width="2.2"/>
      <g id="glasses" class="gp-line" stroke="#1b2a40" stroke-width="2.6">
        <circle cx="69" cy="50" r="9" fill="#cfe3ff" fill-opacity="0.22"/>
        <circle cx="91" cy="50" r="9" fill="#cfe3ff" fill-opacity="0.22"/>
        <line x1="78" y1="50" x2="82" y2="50"/>
        <line x1="60" y1="49" x2="56.5" y2="47"/>
        <line x1="100" y1="49" x2="103.5" y2="47"/>
      </g>
      <g id="eyes" fill="#0d1828">
        <circle id="eye-left" cx="69" cy="51" r="2.8"/>
        <circle id="eye-right" cx="91" cy="51" r="2.8"/>
      </g>
      <g id="brows" class="gp-hair-light" stroke="#0d1828" stroke-width="1.5" stroke-linejoin="round">
        <path id="brow-left" d="M60 39 C63 34 71 33 77 35.5 C71 37 65 37.5 60 39 Z"/>
        <path id="brow-right" d="M83 36 C88 31 95 29 100 30 C95 32.5 89 34.5 83 36 Z"/>
      </g>
    </g>
  </g>
</svg>
