      <ellipse class="gp-skin gp-out" cx="98.8" cy="63" rx="4.4" ry="5.8"/>
      <path class="gp-crease" d="M61.9 60 Q59.6 63 61.9 66 M98.1 60 Q100.4 63 98.1 66"/>
      <path id="face" class="gp-skin gp-out" d="M80 36.5 C91 36.5 98.5 44 98.5 56 C98.5 70 91 81 80 81 C69 81 61.5 70 61.5 56 C61.5 44 69 36.5 80 36.5 Z"/>
      <ellipse cx="91" cy="42" rx="3.4" ry="1.7" fill="#ffffff" opacity="0.35" transform="rotate(-30 91 42)"/>
      <path class="gp-crease" d="M73 44 Q80 42.2 86 44 M75 40.9 Q80 39.7 84 40.9"/>
      <path class="gp-line" d="M79.2 36.8 C77.8 33.6 81.6 32.4 82.2 34.9" stroke="#dfe4ea" stroke-width="1.6"/>
      <ellipse class="gp-blush" cx="65.8" cy="67.6" rx="3.6" ry="2.4"/>
      <ellipse class="gp-blush" cx="94.2" cy="67.6" rx="3.6" ry="2.4"/>
      <path id="beard" class="gp-hair gp-out" d="M61.8 62 C62.5 68 65 71.5 69 72.5 L91 72.5 C95 71.5 97.5 68 98.2 62 C100.5 70 102 79 101.5 88 C101 98 97.5 107 92 114 Q90.5 119 86.5 119.6 Q84 124 80 124.2 Q76 124 73.5 119.6 Q69.5 119 68 114 C62.5 107 59 98 58.5 88 C58 79 59.5 70 61.8 62 Z"/>
      <path class="gp-line gp-strand" d="M66 83 Q67 91 70.5 98 M94 83 Q93 91 89.5 98 M80 84 L80 92 M74.5 103 Q76 110 78 115.5 M85.5 103 Q84 110 82 115.5"/>
      <path class="gp-crease" d="M68.8 64.6 Q72 65.8 75.2 64.6 M84.8 64.6 Q88 65.8 91.2 64.6"/>
      <g id="glasses" class="gp-line" stroke="#1b2a40" stroke-width="2.2">
        <circle cx="72" cy="60" r="6.8" fill="#cfe3ff" fill-opacity="0.22"/>
        <circle cx="88" cy="60" r="6.8" fill="#cfe3ff" fill-opacity="0.22"/>
        <line x1="78.8" y1="60" x2="81.2" y2="60"/>
        <line x1="65.2" y1="59.3" x2="62.4" y2="57.8"/>
        <line x1="94.8" y1="59.3" x2="97.6" y2="57.8"/>
      </g>
      <ellipse class="gp-nose gp-out" cx="80" cy="68" rx="5" ry="4.3"/>
      <ellipse cx="78.3" cy="66.3" rx="1.5" ry="0.9" fill="#ffffff" opacity="0.45"/>
      <path id="mustache" class="gp-hair-light gp-out" d="M80 70.6 C76 68 70.5 68.2 67.8 71.2 C66.4 72.8 65.2 73.4 63.8 72.6 C64.2 75.4 66.8 77 70 76.6 C73.6 76.2 77 75.4 80 74.2 C83 75.4 86.4 76.2 90 76.6 C93.2 77 95.8 75.4 96.2 72.6 C94.8 73.4 93.6 72.8 92.2 71.2 C89.5 68.2 84 68 80 70.6 Z"/>
      <path id="mouth" class="gp-mouth gp-thin" d="M75 77.2 Q80 83 85 77.2 Q80 78.8 75 77.2 Z"/>
      <g id="eyes" fill="#0d1828">
        <g id="eye-left"><circle cx="72" cy="60.8" r="2.4"/><circle cx="72.9" cy="59.9" r="0.8" fill="#ffffff"/></g>
        <g id="eye-right"><circle cx="88" cy="60.8" r="2.4"/><circle cx="88.9" cy="59.9" r="0.8" fill="#ffffff"/></g>
      </g>
      <g id="brows" class="gp-hair-light" stroke="#0d1828" stroke-width="1.3" stroke-linejoin="round">
        <path id="brow-left" d="M64 52.2 C64.5 48.2 69 46 73.5 46.3 C76 46.5 77.8 47.4 78.3 48.6 L76.4 49.4 L76.8 50.6 L74.4 50.2 L73.8 51.4 L71.6 50.6 L70.6 51.9 L68.6 50.9 L67.2 52.4 L66 51.4 Z"/>
        <path id="brow-right" d="M96 52.2 C95.5 48.2 91 46 86.5 46.3 C84 46.5 82.2 47.4 81.7 48.6 L83.6 49.4 L83.2 50.6 L85.6 50.2 L86.2 51.4 L88.4 50.6 L89.4 51.9 L91.4 50.9 L92.8 52.4 L94 51.4 Z"/>
