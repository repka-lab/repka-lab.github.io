<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 230" width="320" height="460">
  <title>Grandpa, animated host character</title>
  <!--
    Character rig for Remotion: a flat-vector grandpa in a suit, with a trimmed beard and glasses.
    Every movable part is its own group; nesting keeps the forearm on the elbow and the shin on the knee.
    Rotate a part with rotate(angle pivotX pivotY) around its pivot:

      head                   80,80   neck
      arm-left               64,100  shoulder
        arm-left-forearm     59,129  elbow (holds the chalk)
      arm-right              96,100  shoulder
        arm-right-forearm    101,129 elbow
      leg-left               72,152  hip
        leg-left-shin        72,184  knee
          leg-left-foot      72,214  ankle
      leg-right              88,152  hip
        leg-right-shin       88,184  knee
          leg-right-foot     88,214  ankle
      eyes                   translate by 2-3 to look left/right
      eye-left, eye-right    pupil and catchlight; blink = scaleY around cy 60.8
      chalk                  display="none" when not at the board

    At rest the legs hang straight down; a standing pose splays them by about 1.5 degrees.
    Each foot holds two shoes: shoe-front (facing the viewer, shown by default) and shoe-side
    (in profile, toe to the right; mirror it with matrix(-1 0 0 1 2*ankleX 0) to face left).
    Walking and sitting show shoe-side and turn the foot so the sole stays level. The side shoe has a flat sole
    with sharp heel and toe corners: the heel-toe walk rolls the foot on them.
    Sitting is legs -90 and shins +90: thighs level under the jacket hem, shins upright,
    knees at hip x + 32, soles at hip y + 37.5.
    Hands sit at 52.9,154.3 and 107.1,154.3, the chalk tip at 49.9,166.4, the soles at y 221.5.
    Each limb draws its outline first and its colour last, after the nested part,
    so elbows and knees bend without a seam.
    The torso's shoulders are arcs of radius 6 around the shoulder pivots and its sides are tangent to them,
    so its outline hides under the sleeve caps and each shoulder reads as one contour. A wider torso
    shows a second shoulder line outside the sleeve.
    The head art is drawn 6 lower inside #head (the coordinates in it are local), so the chin sits
    on the collar and there is no neck. The beard is trimmed close to the jaw and lies on the chest
    down to y 105.5: just enough to hide the tie knot, so the rest of the tie shows below it.
    The face has swept-back grey hair, smooth skin, rosy cheeks and neat brows, so he reads as a lively older man, not a frail one.
    Ready poses (standing at the board, sitting at the desk) are listed
    in the comments of video/assets/scenes/board.svg and desk.svg.
    Classes carry a gp- prefix: the episode puts every scene in one document, so styles are global.
  -->
  <style>
    .gp-line { fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .gp-out { stroke: #0d1828; stroke-width: 2; stroke-linejoin: round; }
    .gp-thin { stroke: #0d1828; stroke-width: 1.5; stroke-linejoin: round; }
    .gp-edge { fill: #0d1828; stroke: #0d1828; stroke-width: 4; stroke-linejoin: round; }
    .gp-sleeve-edge { stroke: #0d1828; stroke-width: 14; }
    .gp-sleeve { stroke: #4a6c9e; stroke-width: 10.5; }
    .gp-cuff { fill: none; stroke: #eef2f6; stroke-width: 10; }
    .gp-trouser { fill: #34507c; }
    .gp-sock { fill: #f08a24; }
    .gp-suit { fill: #4a6c9e; }
    .gp-suit-dark { fill: #3a5784; }
    .gp-shirt { fill: #eef2f6; }
    .gp-tie { fill: #f08a24; }
    .gp-skin { fill: #f1c7a5; }
    .gp-nose { fill: #eba889; }
    .gp-crease { fill: none; stroke: #c98f70; stroke-width: 1.2; stroke-linecap: round; }
    .gp-blush { fill: #f08f7e; opacity: 0.45; }
    .gp-mouth { fill: #7a2e2e; }
    .gp-hair { fill: #c3cbd5; }
    .gp-hair-light { fill: #e3e8ee; }
    .gp-strand { stroke: #8f9bab; stroke-width: 1.4; }
    .gp-brow { fill: #6f7b8b; }
    .gp-shoe { fill: #6b3a1c; }
  </style>

  <g id="grandpa">
    <g id="leg-left">
      <path class="gp-edge" d="M64.5 146 L79.5 146 L78.5 184 A6.5 6.5 0 0 1 65.5 184 Z"/>
      <g id="leg-left-shin">
        <rect class="gp-sock gp-out" x="67.5" y="203" width="9" height="11"/>
        <g id="leg-left-foot">
          <g id="leg-left-shoe-front">
            <path class="gp-shoe gp-out" d="M65.5 221.5 C62.3 221.5 61.2 219.3 61.8 217 C62.8 213.8 66.2 212 71 212 C75.5 212 78.6 213.4 79.3 216.2 C79.9 218.8 78.8 221.5 75.8 221.5 Z"/>
            <ellipse cx="67.5" cy="215.4" rx="3" ry="1.2" fill="#ffffff" opacity="0.25"/>
          </g>
          <g id="leg-left-shoe-side" display="none">
            <path class="gp-shoe gp-out" d="M64 221.5 L64 215 Q64 212 67 212 L74 212 Q77.5 212 80 214.5 Q86 215.5 86 219 L86 221.5 Z"/>
            <ellipse cx="81.5" cy="216.6" rx="2.6" ry="1" fill="#ffffff" opacity="0.25"/>
          </g>
        </g>
        <path class="gp-edge" d="M65.5 184 A6.5 6.5 0 0 1 78.5 184 L78.3 207 L65.7 207 Z"/>
        <path class="gp-trouser" d="M65.5 184 A6.5 6.5 0 0 1 78.5 184 L78.3 207 L65.7 207 Z"/>
      </g>
      <path class="gp-trouser" d="M64.5 146 L79.5 146 L78.5 184 A6.5 6.5 0 0 1 65.5 184 Z"/>
    </g>
    <g id="leg-right">
      <path class="gp-edge" d="M80.5 146 L95.5 146 L94.5 184 A6.5 6.5 0 0 1 81.5 184 Z"/>
      <g id="leg-right-shin">
        <rect class="gp-sock gp-out" x="83.5" y="203" width="9" height="11"/>
        <g id="leg-right-foot">
          <g id="leg-right-shoe-front">
            <path class="gp-shoe gp-out" d="M94.5 221.5 C97.7 221.5 98.8 219.3 98.2 217 C97.2 213.8 93.8 212 89 212 C84.5 212 81.4 213.4 80.7 216.2 C80.1 218.8 81.2 221.5 84.2 221.5 Z"/>
            <ellipse cx="92.5" cy="215.4" rx="3" ry="1.2" fill="#ffffff" opacity="0.25"/>
          </g>
          <g id="leg-right-shoe-side" display="none">
            <path class="gp-shoe gp-out" d="M80 221.5 L80 215 Q80 212 83 212 L90 212 Q93.5 212 96 214.5 Q102 215.5 102 219 L102 221.5 Z"/>
            <ellipse cx="97.5" cy="216.6" rx="2.6" ry="1" fill="#ffffff" opacity="0.25"/>
          </g>
        </g>
        <path class="gp-edge" d="M81.5 184 A6.5 6.5 0 0 1 94.5 184 L94.3 207 L81.7 207 Z"/>
        <path class="gp-trouser" d="M81.5 184 A6.5 6.5 0 0 1 94.5 184 L94.3 207 L81.7 207 Z"/>
      </g>
      <path class="gp-trouser" d="M80.5 146 L95.5 146 L94.5 184 A6.5 6.5 0 0 1 81.5 184 Z"/>
    </g>

    <g id="torso">
      <path class="gp-suit gp-out" d="M58.09 98.98 A6 6 0 0 1 64 94 C72 93 88 93 96 94 A6 6 0 0 1 101.91 98.98 C103.95 110.8 106.5 135 106.5 154 C106.5 158 104.5 159.5 101 160.5 C92 162.5 68 162.5 59 160.5 C55.5 159.5 53.5 158 53.5 154 C53.5 135 56.05 110.8 58.09 98.98 Z"/>
      <path class="gp-shirt" d="M69 95 L91 95 L80 121 Z"/>
      <path class="gp-tie gp-out" d="M76.5 97 L83.5 97 L82 103 L78 103 Z M78 103 L82 103 L83.5 114 L80 118 L76.5 114 Z"/>
      <path class="gp-suit-dark gp-out" d="M69 95 L61 105 L66.5 108.5 L63 112 L80 121 Z M91 95 L99 105 L93.5 108.5 L97 112 L80 121 Z"/>
      <line class="gp-line" x1="80" y1="121" x2="80" y2="162" stroke="#0d1828" stroke-width="1.5"/>
      <path class="gp-suit-dark gp-thin" d="M57 138 L70 138 L70 142 L57 142 Z M90 138 L103 138 L103 142 L90 142 Z"/>
      <circle cx="80" cy="132" r="2.2" fill="#0d1828"/>
      <circle cx="80" cy="144" r="2.2" fill="#0d1828"/>
    </g>

    <g id="arm-right">
      <line class="gp-line gp-sleeve-edge" x1="96" y1="100" x2="101" y2="129"/>
      <g id="arm-right-forearm">
        <line class="gp-line gp-sleeve-edge" x1="101" y1="129" x2="105.37" y2="146.99"/>
        <line class="gp-line gp-sleeve" x1="101" y1="129" x2="105.37" y2="146.99"/>
        <line class="gp-cuff" x1="104.895" y1="145.045" x2="105.845" y2="148.935"/>
        <circle class="gp-skin gp-out" cx="107.13" cy="154.27" r="6"/>
      </g>
      <line class="gp-line gp-sleeve" x1="96" y1="100" x2="101" y2="129"/>
    </g>
    <g id="arm-left">
      <line class="gp-line gp-sleeve-edge" x1="64" y1="100" x2="59" y2="129"/>
      <g id="arm-left-forearm">
        <line class="gp-line gp-sleeve-edge" x1="59" y1="129" x2="54.63" y2="146.99"/>
        <line class="gp-line gp-sleeve" x1="59" y1="129" x2="54.63" y2="146.99"/>
        <line class="gp-cuff" x1="55.105" y1="145.045" x2="54.155" y2="148.935"/>
        <g id="chalk">
          <line x1="52.29" y1="156.66" x2="49.89" y2="166.36" stroke="#0d1828" stroke-width="6.5" stroke-linecap="round"/>
          <line x1="52.29" y1="156.66" x2="49.89" y2="166.36" stroke="#f4f1e8" stroke-width="3.5" stroke-linecap="round"/>
        </g>
        <circle class="gp-skin gp-out" cx="52.87" cy="154.27" r="6"/>
      </g>
      <line class="gp-line gp-sleeve" x1="64" y1="100" x2="59" y2="129"/>
    </g>

    <g id="head">
      <g transform="translate(0 6)">
        <ellipse class="gp-skin gp-out" cx="61.2" cy="63" rx="4.4" ry="5.8"/>
        <ellipse class="gp-skin gp-out" cx="98.8" cy="63" rx="4.4" ry="5.8"/>
        <path class="gp-crease" d="M61.9 60 Q59.6 63 61.9 66 M98.1 60 Q100.4 63 98.1 66"/>
        <path id="face" class="gp-skin gp-out" d="M80 36.5 C91 36.5 98.5 44 98.5 56 C98.5 70 91 81 80 81 C69 81 61.5 70 61.5 56 C61.5 44 69 36.5 80 36.5 Z"/>
        <path id="hair" class="gp-hair gp-out" d="M60.6 57.5 C58.4 44 65.5 31 80.5 30.5 C95 30.3 102.6 42 99.4 57.5 C98.2 52.5 96.6 48.2 93.4 45.4 C87.5 46.6 80.5 45.4 75 42.4 C71 44.4 67 47.8 64 52.6 Z"/>
        <path class="gp-line gp-strand" d="M70.5 36.5 Q78 34.8 86 36.8 M76.5 40.6 Q84.5 40.2 92.5 42.4 M66 41.5 Q68.4 39.4 71.5 39"/>
        <ellipse class="gp-blush" cx="65.8" cy="67.6" rx="3.6" ry="2.4"/>
        <ellipse class="gp-blush" cx="94.2" cy="67.6" rx="3.6" ry="2.4"/>
        <path id="beard" class="gp-hair gp-out" d="M62.2 62 C62.8 68 65.2 71.5 69 72.5 L91 72.5 C94.8 71.5 97.2 68 97.8 62 C99 67.5 99 73.5 97.2 79.5 C94.8 88.5 88 97 80 99.5 C72 97 65.2 88.5 62.8 79.5 C61 73.5 61 67.5 62.2 62 Z"/>
        <path class="gp-line gp-strand" d="M67.5 80 Q69.5 88.5 74 94 M92.5 80 Q90.5 88.5 86 94 M80 89 L80 95.5"/>
        <g id="glasses" class="gp-line" stroke="#1b2a40" stroke-width="2.2">
          <circle cx="72" cy="60" r="6.8" fill="#cfe3ff" fill-opacity="0.22"/>
          <circle cx="88" cy="60" r="6.8" fill="#cfe3ff" fill-opacity="0.22"/>
          <line x1="78.8" y1="60" x2="81.2" y2="60"/>
          <line x1="65.2" y1="59.3" x2="62.4" y2="57.8"/>
          <line x1="94.8" y1="59.3" x2="97.6" y2="57.8"/>
        </g>
        <ellipse class="gp-nose gp-out" cx="80" cy="68" rx="5" ry="4.3"/>
        <ellipse cx="78.3" cy="66.3" rx="1.5" ry="0.9" fill="#ffffff" opacity="0.45"/>
        <path id="mustache" class="gp-hair-light gp-out" d="M80 70.6 C76 68 70.5 68.2 67.8 71.2 C66.4 72.8 65.2 73.4 63.8 72.6 C64.2 75.4 66.8 77 70 76.6 C73.6 76.2 77 75.4 80 74.2 C83 75.4 86.4 76.2 90 76.6 C93.2 77 95.8 75.4 96.2 72.6 C94.8 73.4 93.6 72.8 92.2 71.2 C89.5 68.2 84 68 80 70.6 Z"/>
        <path id="mouth" class="gp-mouth gp-thin" d="M75 77.2 Q80 83 85 77.2 Q80 78.8 75 77.2 Z"/>
        <g id="eyes" fill="#0d1828">
          <g id="eye-left"><circle cx="72" cy="60.8" r="2.4"/><circle cx="72.9" cy="59.9" r="0.8" fill="#ffffff"/></g>
          <g id="eye-right"><circle cx="88" cy="60.8" r="2.4"/><circle cx="88.9" cy="59.9" r="0.8" fill="#ffffff"/></g>
        </g>
        <g id="brows" class="gp-brow" stroke="#0d1828" stroke-width="1" stroke-linejoin="round">
          <path id="brow-left" d="M65.4 51.6 C66.8 48.6 71.4 47.6 76.6 49 L76.2 51.2 C72.2 50.2 68.6 50.6 65.4 51.6 Z"/>
          <path id="brow-right" d="M94.6 51.6 C93.2 48.6 88.6 47.6 83.4 49 L83.8 51.2 C87.8 50.2 91.4 50.6 94.6 51.6 Z"/>
        </g>
      </g>
    </g>
  </g>
</svg>
