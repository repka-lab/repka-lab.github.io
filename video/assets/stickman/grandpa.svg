    .gp-out { stroke: #0d1828; stroke-width: 2; stroke-linejoin: round; }
    .gp-thin { stroke: #0d1828; stroke-width: 1.5; stroke-linejoin: round; }
    .gp-edge { fill: #0d1828; stroke: #0d1828; stroke-width: 4; stroke-linejoin: round; }
    .gp-sleeve-edge { stroke: #0d1828; stroke-width: 14; }
    .gp-sleeve { stroke: #4a6c9e; stroke-width: 10.5; }
    .gp-cuff { fill: none; stroke: #eef2f6; stroke-width: 10; }
    .gp-trouser { fill: #34507c; }
    .gp-sock { fill: #f08a24; }
    .gp-suit { fill: #4a6c9e; }
    .gp-suit-dark { fill: #3a5784; }
    .gp-shirt { fill: #eef2f6; }
    .gp-tie { fill: #f08a24; }
    .gp-skin { fill: #f1c7a5; }
    .gp-nose { fill: #eba889; }
    .gp-crease { fill: none; stroke: #c98f70; stroke-width: 1.2; stroke-linecap: round; }
    .gp-blush { fill: #f08f7e; opacity: 0.45; }
    .gp-mouth { fill: #7a2e2e; }
    .gp-hair { fill: #56606f; }
    .gp-hair-light { fill: #aeb8c4; }
    .gp-strand { stroke: #b4bec9; stroke-width: 1.4; }
    .gp-brow { fill: #2a3442; }
    .gp-shoe { fill: #6b3a1c; }
  </style>

