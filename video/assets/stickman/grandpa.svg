<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 230" width="320" height="460">
  <title>Grandpa, animated host character</title>
  <!--
    Character rig for Remotion: a flat-vector grandpa in a suit, with a trimmed beard and glasses.
    Every movable part is its own group; nesting keeps the forearm on the elbow and the shin on the knee.
    Rotate a part with rotate(angle pivotX pivotY) around its pivot:

      head                   80,80   neck
      arm-left               59,100  shoulder
        arm-left-forearm     54,129  elbow (holds the chalk)
      arm-right              101,100 shoulder
        arm-right-forearm    106,129 elbow
      leg-left               72,152  hip
        leg-left-shin        72,184  knee
          leg-left-foot      72,214  ankle
      leg-right              88,152  hip
        leg-right-shin       88,184  knee
          leg-right-foot     88,214  ankle
      eyes                   translate by 2-3 to look left/right
      eye-left, eye-right    pupil and catchlight; blink = scaleY around cy 60.8
      chalk                  display="none" when not at the board

    At rest the legs hang straight down; a standing pose splays them by about 1.5 degrees.
    Each foot holds two shoes: shoe-front (facing the viewer, shown by default) and shoe-side
    (in profile, toe to the right; mirror it with matrix(-1 0 0 1 2*ankleX 0) to face left).
    Walking and sitting show shoe-side and turn the foot so the sole stays level. The side shoe has a flat sole
    with sharp heel and toe corners: the heel-toe walk rolls the foot on them.
    Sitting is legs -90 and shins +90: thighs level, shins upright, knees at hip x + 32, soles at hip y + 37.5.
    A seated figure is seen in profile: the hips draw in by 8 and the shoulders by 21, so both meet at x 80,
    and #torso-side (the jacket from the side, facing right) replaces #torso-front. Its hem rests on the
    lap and leaves most of the thigh in view. The head turns with it: #head-side (facing right, one ear,
    one lens, the beard on the chest) replaces #head-front, with its own eye-side and brows-side.
    The side torso carries a stand-up collar behind the nape, so the short hair needs no neck below it.
    Hands sit at 47.9,154.3 and 112.1,154.3, the chalk tip at 44.9,166.4, the soles at y 221.5.
    Each limb draws its outline first and its colour last, after the nested part,
    so elbows and knees bend without a seam.
    The front torso's shoulders are arcs of radius 6 around the shoulder pivots and its sides drop straight
    from them, so its outline hides under the sleeve caps and each shoulder reads as one contour. The shoulders
    (53-107) are as wide as the jacket hem (53.5-106.5): narrower ones turn the jacket into a pear, and a torso
    wider than the pivots shows a second shoulder line outside the sleeve.
    The head art is drawn 6 lower inside #head (the coordinates in it are local), so the chin sits
    on the collar and there is no neck. The beard is trimmed close to the jaw and lies on the chest
    down to y 105.5: just enough to hide the tie knot, so the rest of the tie shows below it.
    The face has swept-back hair, smooth skin, rosy cheeks and neat brows, so he reads as a lively older man, not a frail one.
    Hair and beard are dark ash grey with light grey streaks, a light grey mustache and grey temples (the strands),
    which puts him around 55: still a grandpa, but not an old one. The brows are near-navy.
    Ready poses (standing at the board, sitting at the desk) are listed
    in the comments of video/assets/scenes/board.svg and desk.svg.
    Classes carry a gp- prefix: the episode puts every scene in one document, so styles are global.
  -->
  <style>
